[nosetests]
verbosity=2
with-coverage=1
cover-package=.
cover-inclusive=1

[coverage:run]
branch = True
source = .

[coverage:report]
show_missing = True
skip_covered = False

[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    venv,
    .venv
ignore = E203,W503

[pylint]
disable =
    C0114,
    C0116,
    C0103
max-line-length = 100
